<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelir & Gider Takip Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Finansal Takip Paneli</h1>
                <p class="text-slate-400 text-sm mt-1">Gelir ve giderlerinizi anlık olarak izleyin.</p>
            </div>
            <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/20 transition-all cursor-pointer text-sm flex items-center gap-2 self-start md:self-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                Yeni İşlem Ekle
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 backdrop-blur-sm">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-slate-400 text-sm font-medium">Toplam Gelir</span>
                    <div class="p-2 bg-emerald-500/10 rounded-lg text-emerald-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
                    </div>
                </div>
                <div id="total-income" class="text-2xl font-bold text-white">₺0,00</div>
            </div>

            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 backdrop-blur-sm">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-slate-400 text-sm font-medium">Toplam Gider</span>
                    <div class="p-2 bg-rose-500/10 rounded-lg text-rose-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0v-8m0 8l-8-8-4 4-6-6" /></svg>
                    </div>
                </div>
                <div id="total-expense" class="text-2xl font-bold text-white">₺0,00</div>
            </div>

            <div class="bg-gradient-to-br from-indigo-900/40 to-slate-800/50 border border-indigo-500/20 rounded-2xl p-6 backdrop-blur-sm">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-slate-300 text-sm font-medium">Net Bakiye</span>
                    <div class="p-2 bg-indigo-500/10 rounded-lg text-indigo-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                </div>
                <div id="net-balance" class="text-2xl font-bold text-indigo-300">₺0,00</div>
            </div>
        </div>

        <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden backdrop-blur-sm">
            <div class="p-5 border-b border-slate-700/50 flex items-center justify-between bg-slate-800/30">
                <h2 class="text-lg font-semibold text-white">İşlem Geçmişi</h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700/50 text-slate-400 text-xs uppercase tracking-wider font-semibold bg-slate-800/20">
                            <th class="py-4 px-6">Açıklama / Cari</th>
                            <th class="py-4 px-6">Kategori</th>
                            <th class="py-4 px-6">Tarih</th>
                            <th class="py-4 px-6">Tür</th>
                            <th class="py-4 px-6 text-right">Tutar</th>
                            <th class="py-4 px-6 text-center">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-rows" class="divide-y divide-slate-700/40 text-sm text-slate-300">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="transaction-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-4">Yeni İşlem Ekle</h3>
            
            <form id="transaction-form" onsubmit="addTransaction(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Açıklama / Cari</label>
                        <input type="text" id="form-desc" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Kategori</label>
                        <input type="text" id="form-cat" placeholder="Örn: Hizmet, Kira, Ofis" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tarih</label>
                            <input type="date" id="form-date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">İşlem Türü</label>
                            <select id="form-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
                                <option value="income">Gelir</option>
                                <option value="expense">Gider</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tutar (₺)</label>
                        <input type="number" step="0.01" id="form-amount" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm" placeholder="0.00">
                    </div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 rounded-xl text-sm cursor-pointer transition-colors">Vazgeç</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm cursor-pointer transition-colors">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Başlangıç Örnek Verileri
        let transactions = [
            { id: 1, desc: "Yazılım Danışmanlık Bedeli", cat: "Hizmet", date: "2026-06-08", type: "income", amount: 15000 },
            { id: 2, desc: "Ofis Kira Ödemesi", cat: "Kira / Sabit", date: "2026-06-05", type: "expense", amount: 8500 },
            { id: 3, desc: "X Firması Hakediş Ödemesi", cat: "Ticari Faaliyet", date: "2026-06-02", type: "income", amount: 30250 }
        ];

        // Pencereyi Açma / Kapatma Fonksiyonu
        function toggleModal(show) {
            const modal = document.getElementById('transaction-modal');
            if (show) {
                modal.classList.remove('hidden');
                // Bugünün tarihini otomatik seçtir
                document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
            } else {
                modal.classList.add('hidden');
                document.getElementById('transaction-form').reset();
            }
        }

        // Parayı TL formatına çeviren yardımcı fonksiyon
        function formatMoney(amount) {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(amount);
        }

        // Tarihi GG.AA.YYYY formatına çeviren fonksiyon
        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            return `${day}.${month}.${year}`;
        }

        // Arayüzü ve Hesaplamaları Güncelleyen Ana Fonksiyon
        function updateUI() {
            const rowsContainer = document.getElementById('transaction-rows');
            rowsContainer.innerHTML = '';

            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(t => {
                if (t.type === 'income') totalIncome += t.amount;
                else totalExpense += t.amount;

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-700/20 transition-colors";
                row.innerHTML = `
                    <td class="py-4 px-6 font-medium text-white">${t.desc}</td>
                    <td class="py-4 px-6"><span class="bg-slate-700/60 text-slate-300 px-2.5 py-1 rounded-md text-xs">${t.cat}</span></td>
                    <td class="py-4 px-6 text-slate-400">${formatDate(t.date)}</td>
                    <td class="py-4 px-6">
                        <span class="inline-flex items-center gap-1 ${t.type === 'income' ? 'text-emerald-400 bg-emerald-500/10' : 'text-rose-400 bg-rose-500/10'} text-xs font-medium px-2.5 py-1 rounded-full">
                            <span class="w-1.5 h-1.5 rounded-full ${t.type === 'income' ? 'bg-emerald-400' : 'bg-rose-400'}"></span> 
                            ${t.type === 'income' ? 'Gelir' : 'Gider'}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-right font-semibold ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                        ${t.type === 'income' ? '+' : '-'}${formatMoney(t.amount)}
                    </td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="deleteTransaction(${t.id})" class="text-slate-500 hover:text-rose-400 p-1 rounded transition-colors cursor-pointer" title="Sil">🗑️</button>
                    </td>
                `;
                rowsContainer.appendChild(row);
            });

            // Kartları güncelle
            document.getElementById('total-income').innerText = formatMoney(totalIncome);
            document.getElementById('total-expense').innerText = formatMoney(totalExpense);
            document.getElementById('net-balance').innerText = formatMoney(totalIncome - totalExpense);
        }

        // Yeni İşlem Ekleme Fonksiyonu
        function addTransaction(event) {
            event.preventDefault();

            const desc = document.getElementById('form-desc').value;
            const cat = document.getElementById('form-cat').value;
            const date = document.getElementById('form-date').value;
            const type = document.getElementById('form-type').value;
            const amount = parseFloat(document.getElementById('form-amount').value);

            const newTx = {
                id: Date.now(), // Benzersiz ID üretimi
                desc,
                cat,
                date,
                type,
                amount
            };

            transactions.unshift(newTx); // Yeni işlemi listenin başına ekle
            updateUI();
            toggleModal(false);
        }

        // İşlem Silme Fonksiyonu
        function deleteTransaction(id) {
            if(confirm("Bu işlemi silmek istediğinize emin misiniz?")) {
                transactions = transactions.filter(t => t.id !== id);
                updateUI();
            }
        }

        // Sayfa ilk açıldığında verileri yükle
        updateUI();
    </script>
</body>
</html>
